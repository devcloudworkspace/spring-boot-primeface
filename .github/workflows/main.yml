#name of the workflow
name: CI

#triggers
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

#jobs
jobs:
  #job id
  build:
    #runner
    runs-on: ubuntu-latest
    #steps for job
    steps:
      # checkout action to download code into runner
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests and upload reports
        run: |
          mvn test
        continue-on-error: true

#      - name: Upload test report
#        uses: actions/upload-artifact@v4
#        with:
#          name: test-report
#          path: target/surefire-reports/
#
#      - name: Deploy package
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        run: mvn deploy

#      - uses: actions/checkout@v4
      - name: create and push image
        run: |
          chmod +x ./build.sh
          sudo ./build.sh "1.0.$GITHUB_RUN_NUMBER" ${{ secrets.REGISTRY_USERNAME }} ${{ secrets.REGISTRY_TOKEN }}

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
#          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
#          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
#          insecure_skip_tls_verify: true
#          namespace: ${{ env.OPENSHIFT_NAMESPACE }}
          openshift_server_url: https://api.rm2.thpm.p1.openshiftapps.com:6443
          openshift_token: sha256~aQdAeYJrakPT0NSr48hQu30jaQB5n4G4NhKE7JKQUzA
          insecure_skip_tls_verify: true
          namespace: devcloud1user4-dev
      - name: Get POD
        run: |
          oc get all
          oc apply -f deployment/deployment.yml
        continue-on-error: true
